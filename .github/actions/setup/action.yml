name: Preparar bun
description: Instala Node 22, bun y las dependencias con caché.
runs:
  using: composite
  steps:
    # Node 22 LTS (convenciones §7): Jest, tsc y ESLint corren sobre Node.
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.5
    - uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-
    - shell: bash
      run: bun install --frozen-lockfile
