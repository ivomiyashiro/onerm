name: Bug
description: Comportamiento que no coincide con la especificación.
title: "fix(<ámbito>): "
labels: ["tipo: fix"]
projects: ["ivomiyashiro/2"]
body:
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      value: |
        1. 
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Comportamiento esperado
      description: Citar el RF, AC o RN que no se cumple.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Comportamiento actual
    validations:
      required: true
  - type: input
    id: entorno
    attributes:
      label: Entorno
      placeholder: "Android 14, emulador Pixel 7 · con o sin conexión · invitado o con cuenta"
    validations:
      required: true
  - type: textarea
    id: evidencia
    attributes:
      label: Evidencia
      description: Capturas, logs.
